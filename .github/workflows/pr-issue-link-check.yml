name: Linked Issue Check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: false
        default: '0'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  linked-issue:
    name: Require Linked Issue
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check linked issues
        uses: actions/github-script@v7
        env:
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            let prNumber;
            let sourceBranch = '';
            if (context.eventName === 'pull_request_target') {
              prNumber = context.payload.pull_request.number;
              sourceBranch = context.payload.pull_request.head.ref || '';
            } else {
              const inputNumber = parseInt(process.env.PR_NUMBER_INPUT, 10);
              if (isNaN(inputNumber) || inputNumber <= 0) {
                core.setFailed('workflow_dispatch requires a valid pr_number input');
                return;
              }
              prNumber = inputNumber;
            }

            if (sourceBranch.startsWith('dependabot/')) {
              console.log(`Skipping issue link check for dependabot branch: ${sourceBranch}`);
              return;
            }

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const labelNames = labels.map(l => l.name);
            const skipLabels = ['skip-issue-check', 'documentation'];
            if (labelNames.some(name => skipLabels.includes(name))) {
              console.log(`Skipping issue link check due to label: ${labelNames.filter(n => skipLabels.includes(n)).join(', ')}`);
              return;
            }

            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences {
                      totalCount
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: prNumber,
            });

            const linkedIssues = result?.repository?.pullRequest?.closingIssuesReferences?.totalCount ?? 0;
            if (linkedIssues > 0) {
              console.log(`Found ${linkedIssues} linked issue(s) for PR #${prNumber}`);
              return;
            }

            core.setFailed(`No linked issue found for PR #${prNumber}. Please add Closes #<number>, Fixes #<number>, or Resolves #<number> to the PR description.`);
